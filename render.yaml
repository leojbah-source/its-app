# Render Blueprint for KCA Indian Talent Scan (ITS)
# ---------------------------------------------------------------------------
# One free PostgreSQL database + one free Web Service that BOTH runs the API and
# serves the built React app (single origin => one URL to share with testers).
#
# How to use: see DEPLOY-RENDER.md. In short: push this repo to GitHub, then in
# Render click  New +  ->  Blueprint  ->  pick this repo  ->  Apply.
# Render reads this file and creates everything below automatically.
# ---------------------------------------------------------------------------

databases:
  - name: its-db
    databaseName: kca_its
    user: kca_its_user
    # NOTE: this database was upgraded to a paid compute plan in the Render
    # dashboard. This "free" value is stale — do NOT let a blueprint re-sync
    # downgrade the live DB. Prefer making infra changes in the dashboard.
    plan: free
    region: frankfurt          # closest Render region to Bahrain

services:
  - type: web
    name: its-app
    runtime: node
    plan: 0.5c-512mb         # cheapest paid tier (~$7/mo): required for a persistent disk, and stops the free-tier 15-min sleep during the event
    region: frankfurt
    branch: feature/step-5-registrations   # the branch Render deploys; change in Render if you merge to main
    # Persistent disk — uploaded files (logos, payment proofs, notice attachments,
    # team docs) live here so they SURVIVE redeploys. The free filesystem is wiped
    # on every deploy, which is why uploads used to come back broken.
    disk:
      name: its-uploads
      mountPath: /var/data
      sizeGB: 1
    # Build the frontend, then install the backend. A fresh Linux install here
    # pulls the correct native build binaries (unlike a Windows node_modules).
    # --include=dev forces Vite + build tools to install even though NODE_ENV is
    # production (npm would otherwise skip devDependencies and vite would be missing).
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Uploads are written here (on the persistent disk mounted above) instead of
      # the ephemeral public/uploads folder, so they survive redeploys.
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Auth
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: JWT_EXPIRES_IN
        value: 12h
      # TESTING ONLY: lets judges sign in with phone number, no OTP.
      # Set to false (or delete) before going live.
      - key: JUDGE_OTP_BYPASS
        value: "true"
      # OTP settings (unused while bypass is on, kept for completeness)
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      # Database — SSL required on Render; the five values below are injected
      # automatically from the its-db database created above.
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        fromDatabase:
          name: its-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: its-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: its-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: its-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: its-db
          property: database
